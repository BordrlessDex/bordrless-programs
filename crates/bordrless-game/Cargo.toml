[package]
name = "bordrless-game"
description = "The game ticket standard (v1 layouts; phase 2 adds the jackpot and the streak): the header a game coin's token hook keeps in its state, the ticket ranges it keeps in each holding's hook data, the rules that write them (ranges only shrink) and the pure helpers the Bordrless companion reads them with (round arithmetic, a round's ticket total, the verifiable draw index, the winning check)."
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[features]
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang.workspace = true
# sha256 for the draw index: the sol_sha256 syscall on chain, the sha2 crate on the host.
solana-sha256-hasher = { version = "=3.1.0", features = ["sha2"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
