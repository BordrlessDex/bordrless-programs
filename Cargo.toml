# Bordrless on-chain workspace: four Anchor 1.2 programs, one example hook, the shared crates and
# the LiteSVM host tests. Build with scripts/solana/programs.sh (cargo build-sbf, platform-tools
# v1.57, Agave 4.3.0); every dependency is pinned exactly and Cargo.lock is committed.

[workspace]
members = ["programs/*", "crates/*", "programs/tests/fixtures/starters/*", "programs/tests/fixtures/strategies/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"
repository = "https://github.com/BordrlessDex/bordrless-programs"

[workspace.dependencies]
anchor-lang = "=1.2.0"
# security.txt in every deployed program: who to contact and where the source is.
solana-security-txt = "=1.1.3"
bytemuck = { version = "=1.25.2", features = ["derive", "min_const_generics"] }
# Host tests: LiteSVM 0.17.0 and the Solana SDK crates it resolves to.
litesvm = "=0.17.0"
solana-account = "=4.7.0"
solana-hash = "=4.6.0"
solana-keypair = "=3.1.2"
solana-message = "=4.6.0"
solana-rent = "=4.4.0"
solana-signature = "=3.5.2"
solana-signer = "=3.0.1"
solana-transaction = "=4.3.0"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

# Anchor's recommended release profile for on-chain programs. overflow-checks is load-bearing.
[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
