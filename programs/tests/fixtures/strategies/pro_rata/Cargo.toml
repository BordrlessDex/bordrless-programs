# Studio's pro-rata strategy starter (test-only: never deployed by Bordrless). Its src/lib.rs is a
# Studio strategy project's source as is: it builds with nothing but anchor-lang, bordrless-hook and
# bordrless-strategy (the template must vendor bordrless-strategy: docs/phase3a-handover in the
# monorepo). Studio deploys a copy per coin.
[package]
name = "strategy-pro-rata"
description = "Studio's pro-rata strategy starter (test-only): each period pays its holders their share of the budget by weight."
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "strategy_pro_rata"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "bordrless-hook/idl-build", "bordrless-strategy/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang.workspace = true
bordrless-hook = { path = "../../../../../crates/bordrless-hook" }
bordrless-strategy = { path = "../../../../../crates/bordrless-strategy" }

[lints]
workspace = true
