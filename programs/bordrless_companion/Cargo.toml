[package]
name = "bordrless-companion"
description = "Bordrless companions: a launch's creator is a program, so its creator fees are bought back and burned, streamed to holders or vested to its launcher by code, every step permissionless. Reward and buyback tokens with no keeper and no backend to trust."
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "bordrless_companion"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "bordrless-token/idl-build", "bordrless-swap/idl-build", "bordrless-kit/idl-build", "bordrless-launch/idl-build", "bordrless-bridge/idl-build", "bordrless-game/idl-build", "bordrless-hook/idl-build", "bordrless-strategy/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
solana-security-txt = { workspace = true }
anchor-lang = { workspace = true, features = ["event-cpi", "init-if-needed"] }
bordrless-core = { path = "../../crates/bordrless-core" }
# Games (v2): the ticket standard the companion reads a game hook's state and holdings with, and the
# hook registry it resolves a custom hook's extra accounts from.
bordrless-game = { path = "../../crates/bordrless-game" }
bordrless-hook = { path = "../../crates/bordrless-hook" }
# Phase 3a: the strategy interface (plan, entitle) the companion asks a strategy program by CPI.
bordrless-strategy = { path = "../../crates/bordrless-strategy" }
# sha256 for the oracle seed: the sol_sha256 syscall on chain, the sha2 crate on the host.
solana-sha256-hasher = { version = "=3.1.0", features = ["sha2"] }
bordrless-token = { path = "../bordrless_token", features = ["no-entrypoint"] }
bordrless-swap = { path = "../bordrless_swap", features = ["no-entrypoint"] }
bordrless-kit = { path = "../bordrless_kit", features = ["no-entrypoint"] }
bordrless-launch = { path = "../bordrless_launch", features = ["no-entrypoint"] }
bordrless-bridge = { path = "../bordrless_bridge", features = ["no-entrypoint"] }

[lints]
workspace = true
