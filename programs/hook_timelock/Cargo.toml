[package]
name = "hook-timelock"
description = "Bordrless hook timelock: holds a hook's (or a strategy's) upgrade authority behind a public delay of at least 3 days. Proposals carry the new code's executable hash on chain; anyone executes them once the delay has passed; the author can cancel; the authority can only ever move to none (immutable)."
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "hook_timelock"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "bordrless-hook/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { workspace = true, features = ["event-cpi"] }
solana-security-txt = { workspace = true }
bordrless-hook = { path = "../../crates/bordrless-hook" }
# sha256 of a proposal's code: the sol_sha256 syscall on chain, the sha2 crate on the host.
solana-sha256-hasher = { version = "=3.1.0", features = ["sha2"] }

[lints]
workspace = true
