[package]
name = "bordrless-swap"
description = "The Bordrless DEX: constant-product pools between Bordrless Token Standard mints with Uniswap-v4-style hooks (before and after swaps and liquidity changes, with return deltas and dynamic fees), virtual reserves for launch curves, LP tokens on BTS and protocol fees."
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "bordrless_swap"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "bordrless-hook/idl-build", "bordrless-token/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
solana-security-txt = { workspace = true }
anchor-lang = { workspace = true, features = ["event-cpi"] }
bordrless-core = { path = "../../crates/bordrless-core" }
bordrless-hook = { path = "../../crates/bordrless-hook" }
bordrless-token = { path = "../bordrless_token", features = ["no-entrypoint"] }

[dev-dependencies]
bordrless-bridge = { path = "../bordrless_bridge", features = ["no-entrypoint"] }

[lints]
workspace = true
